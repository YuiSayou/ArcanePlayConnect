<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Wall - ArcanePlayConnect</title>
<link rel="stylesheet" href="/shared/theme.css">
<style>
.overlay-container { padding: 16px; width: 520px; }

/* --- Gift List (Vertical) --- */
.gifts-list {
    display: flex; flex-direction: column; gap: 10px;
}

.gift-card {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px; position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: slideIn 0.4s ease forwards;
    opacity: 0;
}
.gift-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--glow);
}
.gift-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--gradient);
    border-radius: 4px 0 0 4px;
}

/* --- Gift Image --- */
.gift-img {
    width: 64px; height: 64px;
    object-fit: contain; border-radius: 10px;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
    background: rgba(255,255,255,0.03);
    padding: 4px;
}

/* --- Gift Info --- */
.gift-info {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 3px;
}

.gift-name {
    font-size: 20px; font-weight: 700;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px; line-height: 1.3;
}

.gift-price {
    display: flex; align-items: center; gap: 4px;
    margin-top: 4px; font-size: 16px;
    font-weight: 600; color: var(--accent);
}
.gift-price.free {
    color: var(--accent2); font-style: italic;
}

.gift-text {
    font-size: 20px; font-weight: 600;
    color: var(--accent2); text-align: center;
    padding: 5px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 8px; flex-shrink: 0;
    max-width: 180px; word-wrap: break-word;
    line-height: 1.3;
}
</style>
</head>
<body>
<div class="overlay-container">
    <div class="header">
        <h1>Gift Wall</h1>
        <div class="header-line"></div>
        <div class="header-sub">TikTok Gifts and Interactions</div>
    </div>
    <div class="gifts-list" id="giftsList"></div>
    <div id="emptyState" class="empty-state" style="display:none">
        <div class="empty-icon">&#x1F381;</div>
        No gifts have been configured for this overlay.
    </div>
</div>
<script src="/shared/overlay-core.js"></script>
<script>
'use strict';
(function() {
    const params = ArcaneOverlay.getParams();
    const urlParams = new URLSearchParams(window.location.search);
    const giftsParam = urlParams.get('gifts');

    let staticGifts = null;
    if (giftsParam) {
        try { staticGifts = JSON.parse(giftsParam); } catch (e) { /* ignore */ }
    }

    function renderGiftList(gifts, container) {
        const empty = document.getElementById('emptyState');
        container.innerHTML = '';

        if (!gifts || !gifts.length) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        gifts.forEach(function(g, i) {
            const card = document.createElement('div');
            card.className = 'gift-card';
            card.style.animationDelay = (i * 0.06) + 's';

            const img = document.createElement('img');
            img.className = 'gift-img';
            img.alt = g.name;
            img.src = g.localImg || g.remoteImg;
            img.onerror = function() {
                if (g.remoteImg && this.src !== g.remoteImg) {
                    this.src = g.remoteImg;
                }
            };

            const info = document.createElement('div');
            info.className = 'gift-info';

            const name = document.createElement('div');
            name.className = 'gift-name';
            name.textContent = g.name;
            name.title = g.name;

            const price = document.createElement('div');
            price.className = 'gift-price';
            if (g.isFree) {
                price.classList.add('free');
                price.textContent = 'FREE';
            } else {
                price.innerHTML = g.price + ' &#x1FA99;';
            }

            info.appendChild(name);
            info.appendChild(price);

            card.appendChild(img);
            card.appendChild(info);

            if (g.text && g.text.length > 0) {
                const txt = document.createElement('div');
                txt.className = 'gift-text';
                txt.textContent = g.text;
                card.appendChild(txt);
            }

            container.appendChild(card);
        });
    }

    function renderDynamic(data) {
        const list = document.getElementById('giftsList');
        const gifts = data.gifts || data.players || [];
        renderGiftList(gifts, list);
    }

    ArcaneOverlay.applyTheme(params.theme);

    if (staticGifts) {
        renderGiftList(staticGifts, document.getElementById('giftsList'));
    } else {
        ArcaneOverlay.init(renderDynamic);
    }
})();
</script>
</body>
</html>
